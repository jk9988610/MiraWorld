# Include inside the existing bykc server block (keeps / as bykc).
# include /etc/nginx/snippets/miraworld.conf;

location = /miraworld {
    return 301 /miraworld/;
}

# Do not use $uri/ — directory hits become 403 when autoindex is off.
location ^~ /miraworld/ {
    root /var/www/html;
    index index.html;
    try_files $uri $uri.html /miraworld/index.html;
}
