# Include inside the bykc (IP default) server block.
# include /etc/nginx/snippets/miraworld.conf;

location = /miraworld {
    return 301 /miraworld/;
}

# Auth API (FastAPI on 127.0.0.1:8787)
location ^~ /miraworld/api/ {
    rewrite ^/miraworld/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Serve MiraWorld on IP: http://8.133.252.224/miraworld/
# Do not use $uri/ — bare directories become 403 when autoindex is off.
location ^~ /miraworld/ {
    root /var/www/html;
    index index.html;
    try_files $uri $uri.html /miraworld/index.html;
}
